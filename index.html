<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SSG Tasks">
  <meta name="theme-color" content="#1e1f21">
  <!-- Icon files are versioned by name: iOS caches Home Screen icons by URL, so a new look needs a new file name -->
  <link rel="apple-touch-icon" sizes="180x180" href="ssg-icon-180.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="ssg-icon-180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="ssg-icon-512.png">
  <link rel="manifest" href="manifest.json?v=2">
  <title>Soundslinger Tasks</title>
  <style>
    /* ── THEME ─────────────────────────────────── */
    html { font-size:17px; -webkit-text-size-adjust:100%; }
    html[data-theme="dark"] {
      --bg:#1e1f21; --surface:#252628; --surface2:#2f3033; --border:#3a3b3e; --text:#f5f4f3; --muted:#a2a0a2;
      --faint:#6d6e6f; --blue:#4c7fe0; --red:#f06a6a; --red-bg:rgba(240,106,106,.17); --green:#58a182;
      --green-text:#7fd0a8; --overlay:rgba(0,0,0,.6); --shadow:0 8px 28px rgba(0,0,0,.55); --seg-on:#45464a;
    }
    html[data-theme="light"] {
      --bg:#f6f7f8; --surface:#ffffff; --surface2:#eef0f2; --border:#e0e2e5; --text:#1e1f21; --muted:#6d6e6f;
      --faint:#9ca0a4; --blue:#3b6fd4; --red:#d1453b; --red-bg:#fde7e5; --green:#2f8f60;
      --green-text:#2f8f60; --overlay:rgba(0,0,0,.35); --shadow:0 8px 28px rgba(0,0,0,.15); --seg-on:#ffffff;
    }
    :root { --accent:#60B40E; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:1rem; line-height:1.35; }
    body.noscroll { overflow:hidden; }
    button { font-family:inherit; cursor:pointer; }
    svg { display:block; }

    /* ── LAYOUT ────────────────────────────────── */
    .app { max-width:680px; margin:0 auto; padding-bottom:calc(9rem + env(safe-area-inset-bottom)); }
    .view { display:none; }
    .view.active { display:block; }
    .vhead { display:flex; align-items:flex-end; justify-content:space-between; gap:.6rem; padding:calc(env(safe-area-inset-top) + 1rem) 1.1rem .7rem; }
    .vtitle { font-size:2rem; font-weight:700; margin:0; line-height:1.15; }
    .vdate { color:var(--muted); font-size:1rem; margin-bottom:.2rem; }
    .loading { color:var(--muted); text-align:center; padding:1.5rem; }
    .empty { color:var(--muted); text-align:center; padding:1.6rem 1rem; }
    .error-msg { color:#fff; background:var(--red); border-radius:.65rem; padding:.75rem .9rem; margin:.6rem 0; font-weight:600; display:flex; gap:.5rem; align-items:flex-start; animation:shake .35s; }
    .error-msg::before { content:'\26A0\FE0F'; }
    @keyframes shake { 0%,100% { transform:none; } 25% { transform:translateX(-6px); } 50% { transform:translateX(5px); } 75% { transform:translateX(-3px); } }

    /* ── TAB BAR + FLOATING BAR ────────────────── */
    .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--surface); border-top:1px solid var(--border); display:flex; justify-content:center; padding:.3rem 0 calc(.3rem + env(safe-area-inset-bottom)); }
    .tabbar-inner { display:flex; width:100%; max-width:680px; }
    .tab { flex:1; background:none; border:0; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:.15rem; font-size:.7rem; padding:.3rem 0; position:relative; }
    .tab.active { color:var(--text); }
    .tab svg { width:1.55rem; height:1.55rem; }
    .tab .dot { position:absolute; top:.25rem; left:calc(50% + .5rem); width:.55rem; height:.55rem; border-radius:50%; background:var(--blue); display:none; }
    .tab .dot.on { display:block; }
    .floatbar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(4.4rem + env(safe-area-inset-bottom)); z-index:45; display:none; gap:.4rem; padding:.35rem; background:var(--surface2); border:1px solid var(--border); border-radius:1.7rem; box-shadow:var(--shadow); }
    .floatbar.on { display:flex; }
    .fb { height:2.7rem; min-width:2.7rem; border-radius:1.35rem; border:0; background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; gap:.4rem; padding:0 1rem; font-size:.98rem; white-space:nowrap; }
    .fb svg { width:1.3rem; height:1.3rem; }
    .fb.icon { padding:0; }
    .fb.on { box-shadow:inset 0 0 0 2px var(--blue); }
    .fb.plus { background:var(--accent); color:#fff; padding:0; }

    /* ── TASK LIST ─────────────────────────────── */
    .sec { display:flex; align-items:center; gap:.65rem; padding:.95rem 1.1rem .5rem; font-size:1.15rem; font-weight:600; border-top:6px solid var(--surface); cursor:pointer; user-select:none; -webkit-user-select:none; }
    .sec .caret { width:0; height:0; border-left:.36rem solid transparent; border-right:.36rem solid transparent; border-top:.46rem solid var(--muted); transition:transform .15s; }
    .sec.collapsed .caret { transform:rotate(-90deg); }
    .sec .count { margin-left:auto; color:var(--muted); font-weight:400; font-size:1rem; }
    .sec.red .stitle { color:var(--red); }
    .rows.hidden { display:none; }
    .row { display:flex; align-items:center; gap:.8rem; padding:0 1.1rem; cursor:pointer; }
    .row-body { flex:1; min-width:0; display:flex; align-items:center; gap:.6rem; padding:.72rem 0; }
    .row + .row .row-body { border-top:1px solid var(--border); }
    .row-main { flex:1; min-width:0; }
    .row-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:1.02rem; }
    .row.done .row-title { color:var(--muted); }
    .row-sub { color:var(--muted); font-size:.86rem; margin-top:.12rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .check { flex:0 0 auto; width:1.45rem; height:1.45rem; border-radius:50%; border:1.5px solid var(--muted); color:var(--muted); display:flex; align-items:center; justify-content:center; background:none; padding:0; }
    .check svg { width:.85rem; height:.85rem; }
    .check.done { background:var(--green); border-color:var(--green); color:#fff; }
    .date-pill { flex:0 0 auto; font-size:.86rem; padding:.28rem .6rem; border-radius:.4rem; color:var(--muted); white-space:nowrap; }
    .date-pill.overdue { background:var(--red-bg); color:var(--red); }
    .date-pill.today { color:var(--green-text); }
    .date-none { flex:0 0 auto; width:1.9rem; height:1.9rem; border-radius:50%; border:1.5px dashed var(--faint); color:var(--faint); display:flex; align-items:center; justify-content:center; }
    .date-none svg { width:.95rem; height:.95rem; }

    /* ── CARDS (Home) ──────────────────────────── */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:1.15rem; margin:0 1rem 1rem; padding:1rem 1.1rem; }
    .card h3 { margin:0 0 .75rem; font-size:1.18rem; display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
    .linkbtn { color:var(--blue); font-size:.92rem; font-weight:500; background:none; border:0; padding:0; }
    .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; }
    .tile { background:var(--surface2); border:0; border-radius:.85rem; padding:.75rem .7rem; text-align:left; color:var(--text); }
    .tile b { display:block; font-size:1.7rem; font-weight:700; line-height:1.1; }
    .tile span { color:var(--muted); font-size:.82rem; }
    .tile.red b { color:var(--red); }
    .tile.green b { color:var(--green-text); }
    .lbtn { display:flex; align-items:center; gap:.8rem; width:100%; background:none; border:0; color:var(--text); padding:.62rem 0; font-size:1rem; text-align:left; }
    .lbtn + .lbtn { border-top:1px solid var(--border); }
    .lbtn .grow { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lbtn.done .grow { color:var(--muted); }
    .chev { color:var(--muted); }
    .chev svg { width:1rem; height:1rem; }
    .swatch { width:.85rem; height:.85rem; border-radius:.22rem; flex:0 0 auto; display:inline-block; }
    .statline { display:flex; gap:1.1rem; flex-wrap:wrap; color:var(--muted); font-size:.9rem; }
    .statline b { color:var(--text); font-size:1.3rem; display:block; }
    .statline b.red { color:var(--red); } .statline b.green { color:var(--green-text); }

    /* ── ACTIVITY ──────────────────────────────── */
    .grp { background:var(--surface); color:var(--muted); padding:.5rem 1.1rem; font-size:.92rem; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
    .ahead { display:flex; align-items:center; gap:.6rem; padding:1rem 1.1rem .45rem; font-weight:600; font-size:1.05rem; }
    .ahead svg { width:1.25rem; height:1.25rem; color:var(--muted); }
    .acard { border:1px solid var(--border); border-radius:.9rem; margin:.3rem 1rem .9rem; overflow:hidden; background:var(--surface); }
    .acard .row { padding:0 .9rem; }
    .act { display:flex; gap:.8rem; padding:.85rem 1.1rem; cursor:pointer; border-bottom:1px solid var(--border); }
    .act-main { flex:1; min-width:0; }
    .act-text { font-size:.98rem; }
    .act-text b { font-weight:600; }
    .act-time { color:var(--muted); font-size:.82rem; margin-top:.15rem; }
    .act-quote { background:var(--surface2); border-radius:.55rem; padding:.45rem .65rem; margin-top:.4rem; font-size:.92rem; }
    .newdot { width:.6rem; height:.6rem; border-radius:50%; background:var(--blue); flex:0 0 auto; margin-top:.45rem; }

    /* ── SEARCH ────────────────────────────────── */
    .searchbox { position:relative; margin:calc(env(safe-area-inset-top) + 1rem) 1rem .6rem; }
    .searchbox input { width:100%; background:var(--surface2); color:var(--text); border:0; border-radius:.75rem; padding:.8rem .9rem .8rem 2.6rem; font-size:1.02rem; font-family:inherit; -webkit-appearance:none; }
    .searchbox span svg { position:absolute; left:.85rem; top:50%; transform:translateY(-50%); width:1.15rem; height:1.15rem; color:var(--muted); }
    .qhead { font-weight:600; font-size:1.12rem; padding:1rem 1.1rem .35rem; }
    .qitem { display:flex; align-items:center; gap:.9rem; width:100%; padding:.3rem 1.1rem; background:none; border:0; color:var(--text); font-size:1.02rem; text-align:left; }
    .qitem .qtext { flex:1; padding:.75rem 0; }
    .qitem + .qitem .qtext { border-top:1px solid var(--border); }
    .qicon { width:2.4rem; height:2.4rem; border-radius:50%; background:var(--surface2); color:var(--muted); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
    .qicon svg { width:1.2rem; height:1.2rem; }
    .reshead { display:flex; align-items:center; gap:.4rem; padding:.2rem .6rem .5rem; }
    .reshead b { font-size:1.15rem; }
    .reshead span { color:var(--muted); margin-left:auto; padding-right:.6rem; white-space:nowrap; }

    /* ── ACCOUNT ───────────────────────────────── */
    .profile { text-align:center; padding:calc(env(safe-area-inset-top) + 1.4rem) 1rem 1rem; }
    .profile .avatar { margin:0 auto .7rem; }
    .profile h2 { margin:0; font-size:1.55rem; }
    .profile p { margin:.2rem 0 0; color:var(--muted); }
    .setlabel { color:var(--muted); font-size:.9rem; margin:.9rem 0 .4rem; }
    .card h3 + .setlabel { margin-top:0; }
    .seg { display:flex; background:var(--surface2); border-radius:.65rem; padding:.2rem; gap:.2rem; }
    .seg button { flex:1; border:0; background:none; color:var(--text); padding:.55rem .3rem; border-radius:.5rem; font-size:.94rem; }
    .seg button.on { background:var(--seg-on); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.25); }
    .signout { display:block; width:calc(100% - 2rem); margin:0 1rem 1rem; padding:.85rem; border-radius:.8rem; border:1px solid var(--border); background:var(--surface); color:var(--red); font-size:1.02rem; font-weight:600; }

    /* ── SHEETS ────────────────────────────────── */
    .sheet { position:fixed; top:0; right:0; bottom:0; left:0; z-index:200; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; transform:translateX(100%); visibility:hidden; transition:transform .25s ease, visibility 0s .25s; }
    .sheet.open { transform:none; visibility:visible; transition:transform .25s ease; }
    .sheet .inner { max-width:680px; margin:0 auto; padding-bottom:calc(2.5rem + env(safe-area-inset-bottom)); }
    .sheet.bottom { top:auto; max-height:88vh; border-radius:1.2rem 1.2rem 0 0; background:var(--surface); transform:translateY(105%); box-shadow:var(--shadow); z-index:220; }
    .sheet.bottom.open { transform:none; }
    .scrim { position:fixed; top:0; right:0; bottom:0; left:0; z-index:210; background:var(--overlay); display:none; }
    .scrim.on { display:block; }
    .topbar { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:.5rem; padding:calc(env(safe-area-inset-top) + .8rem) .7rem .6rem; min-height:3.4rem; }
    .sheet.bottom .topbar { background:var(--surface); padding-top:.7rem; border-radius:1.2rem 1.2rem 0 0; }
    .topbar .ttl { flex:1; text-align:center; font-weight:600; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .topbar .spacer { flex:1; }
    .iconbtn { width:2.75rem; height:2.75rem; border-radius:50%; border:0; background:none; color:var(--text); display:flex; align-items:center; justify-content:center; flex:0 0 auto; padding:0; }
    .iconbtn svg { width:1.45rem; height:1.45rem; }
    /* Top-bar text buttons: at least 44px tall so they're easy to hit */
    .textbtn { background:none; border:0; color:var(--blue); font-size:1rem; font-weight:500; min-height:2.75rem; padding:.6rem .5rem; }
    .textbtn.strong { font-weight:700; background:var(--accent); color:#fff; border-radius:1.4rem; padding:.6rem 1.1rem; }
    .pillbtn { border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:1.4rem; padding:.5rem 1rem; display:flex; align-items:center; gap:.45rem; font-size:.98rem; }
    .pillbtn svg { width:1.1rem; height:1.1rem; }
    .pillbtn.done { background:var(--green); border-color:var(--green); color:#fff; }
    .pad { padding:1rem 1.1rem; }

    /* ── TASK DETAIL ───────────────────────────── */
    .d-title { font-size:1.75rem; font-weight:700; margin:1.1rem 1.1rem .15rem; line-height:1.22; }
    .d-sub { margin:0 1.1rem .2rem; color:var(--muted); font-style:italic; }
    .d-meta { display:flex; align-items:center; gap:.8rem; padding:1.1rem; border-bottom:1px solid var(--border); }
    .m { display:flex; align-items:center; gap:.65rem; flex:1; min-width:0; }
    .m small { display:block; color:var(--muted); font-size:.86rem; }
    .m b { display:block; font-weight:500; font-size:1.06rem; overflow-wrap:anywhere; }
    .m b.overdue { color:var(--red); }
    .calicon { width:2.5rem; height:2.5rem; border-radius:50%; border:1.5px solid var(--muted); color:var(--muted); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
    .calicon svg { width:1.2rem; height:1.2rem; }
    .calicon.overdue { border-color:var(--red); color:var(--red); }
    .recur { color:var(--red); }
    .recur svg { width:1.3rem; height:1.3rem; }
    .avatar { width:2.5rem; height:2.5rem; border-radius:50%; color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:.92rem; flex:0 0 auto; letter-spacing:.02em; }
    .avatar svg { width:1.35rem; height:1.35rem; }
    .avatar.sm { width:1.9rem; height:1.9rem; font-size:.72rem; }
    .avatar.sm svg { width:1.05rem; height:1.05rem; }
    .avatar.lg { width:5.5rem; height:5.5rem; font-size:2rem; }
    .d-sec { padding:1rem 1.1rem; border-bottom:1px solid var(--border); }
    .d-sec h2 { font-size:1.22rem; margin:0 0 .7rem; font-weight:600; display:flex; align-items:center; gap:.5rem; }
    .d-sec h2 .muted { font-weight:400; font-size:1rem; margin-left:auto; }
    .d-row { display:flex; align-items:center; justify-content:space-between; gap:.6rem; flex-wrap:wrap; }
    .loc-pill { display:inline-flex; align-items:center; gap:.45rem; background:var(--surface2); border-radius:.45rem; padding:.38rem .75rem; font-weight:500; }
    .maplink { display:inline-flex; align-items:center; gap:.3rem; color:var(--blue); text-decoration:none; font-weight:500; padding:.38rem .2rem; vertical-align:middle; }
    .maplink svg { width:1.05rem; height:1.05rem; }
    .ftable { border:1px solid var(--border); border-radius:.95rem; overflow:hidden; }
    .fr { display:grid; grid-template-columns:1fr 1fr; }
    .fr + .fr { border-top:1px solid var(--border); }
    .fr > div { padding:.8rem .95rem; }
    .fr > div:first-child { color:var(--muted); border-right:1px solid var(--border); }
    .tag { display:inline-block; padding:.22rem .62rem; border-radius:.38rem; font-weight:500; font-size:.96rem; color:#1e1f21; }
    .p-urgent { background:#e8615a; color:#fff; } .p-high { background:#f1a26b; } .p-medium { background:#f8d86a; } .p-low { background:#9ee7e3; }
    .s-active { background:#8da8f5; } .s-overdue { background:#f06a6a; } .s-complete { background:#7ed3a0; }
    .tag-note { color:var(--muted); font-size:.86rem; margin-top:.3rem; }
    .desc { white-space:pre-wrap; }
    .desc-tr { color:var(--muted); font-style:italic; margin-top:.5rem; padding-top:.5rem; border-top:1px dashed var(--border); white-space:pre-wrap; }
    .sub { display:flex; align-items:center; gap:.7rem; padding:.55rem 0; }
    .sub + .sub { border-top:1px solid var(--border); }
    .sub-text { flex:1; min-width:0; }
    .sub-text small { display:block; color:var(--muted); font-style:italic; }
    .sub.done .sub-text { color:var(--muted); text-decoration:line-through; }
    .sub .iconbtn { width:2rem; height:2rem; color:var(--muted); }
    .sub .iconbtn svg { width:1.05rem; height:1.05rem; }
    .addline { display:flex; gap:.5rem; margin-top:.7rem; }
    .addline .input { flex:1; }
    .photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(6.2rem,1fr)); gap:.6rem; }
    .photo-grid.small { grid-template-columns:repeat(auto-fill,minmax(4.2rem,1fr)); margin-top:.5rem; }
    .photo-item img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:.55rem; background:var(--surface2); display:block; cursor:pointer; }
    .photo-map { display:block; text-align:center; margin-top:.3rem; font-size:.78rem; font-weight:600; color:var(--blue); text-decoration:none; }
    .comment { display:flex; gap:.7rem; padding:.75rem 0; }
    .comment + .comment { border-top:1px solid var(--border); }
    .c-main { flex:1; min-width:0; }
    .c-head { font-size:.86rem; color:var(--muted); margin-bottom:.15rem; }
    .c-head b { color:var(--text); font-weight:600; }
    .c-text { white-space:pre-wrap; }
    .c-tr { color:var(--muted); font-style:italic; font-size:.92rem; margin-top:.35rem; white-space:pre-wrap; }
    .footer-note { color:var(--muted); font-size:.86rem; padding:1rem 1.1rem; line-height:1.6; }

    /* ── FORMS ─────────────────────────────────── */
    .field { margin-bottom:.95rem; }
    .field label { display:block; color:var(--muted); font-size:.9rem; margin-bottom:.35rem; }
    .input, .field input, .field select, .field textarea { width:100%; min-width:0; max-width:100%; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:.65rem; padding:.72rem .8rem; font-size:1rem; font-family:inherit; }
    /* iPhone gives date/time boxes a built-in minimum width that overflows two-column rows */
    .field input[type="date"], .field input[type="time"] { -webkit-appearance:none; appearance:none; display:block; min-height:2.95rem; }
    .field input::-webkit-date-and-time-value { text-align:left; }
    .field.invalid input, .field.invalid select, .field.invalid textarea { border:2px solid var(--red); box-shadow:0 0 0 3px var(--red-bg); }
    .field-err { color:var(--red); font-weight:700; margin-top:.4rem; font-size:.95rem; animation:shake .35s; }
    .field-err::before { content:'\26A0\FE0F  '; }
    .sheet.bottom .field select, .sheet.bottom .field input { background:var(--surface2); }
    .field textarea { min-height:5.5rem; resize:vertical; }
    .field .hint { color:var(--faint); font-size:.82rem; margin-top:.25rem; }
    .two { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:.7rem; }
    .btn { border:0; border-radius:.65rem; padding:.78rem 1rem; font-size:1rem; font-weight:600; background:var(--accent); color:#fff; }
    .btn.block { display:block; width:100%; }
    .btn.danger { background:var(--red); color:#fff; }
    .btn:disabled, button:disabled { opacity:.55; cursor:wait; }
    .ok-msg { color:var(--green-text); padding:.6rem 0; }
    table.stats { width:100%; border-collapse:collapse; font-size:.9rem; }
    table.stats th { text-align:left; color:var(--muted); font-weight:500; padding:.5rem .35rem; border-bottom:1px solid var(--border); }
    table.stats td { padding:.55rem .35rem; border-bottom:1px solid var(--border); vertical-align:top; }
    .red { color:var(--red); } .green { color:var(--green-text); } .muted { color:var(--muted); }

    /* ── MENU, TOAST, LIGHTBOX, SIGN-IN ────────── */
    .menu { position:fixed; top:calc(env(safe-area-inset-top) + 3.4rem); right:.8rem; z-index:270; min-width:13.5rem; background:var(--surface2); border:1px solid var(--border); border-radius:.85rem; box-shadow:var(--shadow); overflow:hidden; display:none; }

    body.noscroll .toast { bottom:auto; top:calc(env(safe-area-inset-top) + 4.4rem); }

    .lb-close { position:absolute; top:calc(env(safe-area-inset-top) + .8rem); right:.8rem; width:2.8rem; height:2.8rem; border-radius:50%; border:0; background:rgba(255,255,255,.15); color:#fff; font-size:1.6rem; }

    .signin button { display:block; width:100%; max-width:16rem; margin:.9rem auto 0; padding:.85rem; border:0; border-radius:.6rem; background:var(--accent); color:#fff; font-size:1.05rem; font-weight:600; }
    .signin .error-msg { max-width:16rem; margin:.9rem auto 0; background:rgba(240,106,106,.15); color:#f39a9a; }

<body>

  <!-- Screens are built by the script below. Every label goes through t() so it appears in each
       person's own language. Clicks are handled by one listener that reads data-act / data-arg. -->

  <script>
    // ═══════════════════════════════════════════
    // DATA SERVICE
    // ═══════════════════════════════════════════
    // The Apps Script web app (Code.gs doPost). Calls go straight to it, so the page never runs
    // inside Google's frame and works in any browser, signed in to Google or not.
    var API_URL = window.SSG_API_URL || 'https://script.google.com/macros/s/AKfycbyfgahbomxXh-cEYFgfhe1brFF7jG8qQl62zvIIZZdAtP6mTYRyTM31E-HrYFqfMeqYFw/exec';
    var API_FUNCTIONS = ['getTasksJSON','getLocationsJSON','getTeamJSON','getCommentsJSON','getPhotosJSON',
      'createTask','updateTask','completeTask','reopenTask','deleteTask','addComment','savePhoto',
      'addLocation','removeLocation','addTeamMember','removeTeamMember','setMemberPin',
      'changeDeletePassword','auditOrphansJSON','deleteOrphansJSON',
      'getTeamAdminJSON','setMemberLanguage','getLoginLogJSON',
      'getSubtasksJSON','addSubtask','updateSubtask','deleteSubtask','toggleSubtask',
      'getActivityJSON','markActivitySeen'];

    // Short device label for the login log, e.g. "iPhone - Safari (Home Screen)"
    function deviceLabel() {
      var ua = navigator.userAgent || '';
      var dev = /iPad/.test(ua) ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android'
        : /Macintosh/.test(ua) ? (navigator.maxTouchPoints > 1 ? 'iPad' : 'Mac') : /Windows/.test(ua) ? 'Windows' : 'Other';
      var br = /EdgiOS|Edg\//.test(ua) ? 'Edge' : /CriOS|Chrome\//.test(ua) ? 'Chrome'
        : /FxiOS|Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Browser';
      var home = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      return dev + ' - ' + br + (home ? ' (Home Screen)' : '');
    }

    // POSTs {fn, args, pin, device}. text/plain keeps it a "simple" cross-site request (no preflight),
    // which Apps Script requires.
    function callApi(fn, args, onOk, onFail, pinOverride) {
      var fail = function(msg) { if (onFail) onFail(new Error(msg)); };
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: args, pin: pinOverride || getPin(), device: deviceLabel() })
      }).then(function(resp) { return resp.text(); }).then(function(text) {
        var res;
        try { res = JSON.parse(text); } catch(e) { fail('Unexpected server response'); return; }
        if (res.ok) { if (onOk) onOk(res.result); return; }
        if (res.auth === false && fn !== 'signIn') showSignIn(res.error);
        fail(res.error || 'Unknown error');
      }).catch(function(err) { fail(err && err.message ? err.message : 'Network error'); });
    }

    // Same calling style as Apps Script's google.script.run:
    // google.script.run.withSuccessHandler(f).withFailureHandler(g).getTasksJSON()
    function makeRunner(onOk, onFail) {
      var r = {
        withSuccessHandler: function(f) { return makeRunner(f, onFail); },
        withFailureHandler: function(f) { return makeRunner(onOk, f); }
      };
      API_FUNCTIONS.forEach(function(name) {
        r[name] = function() { callApi(name, Array.prototype.slice.call(arguments), onOk, onFail); };
      });
      return r;
    }
    var google = { script: { run: makeRunner(null, null) } };

    // google.script.run with JSON parsing and a failure handler that shows a readable message
    function server(onSuccess, onError) {
      return google.script.run

          var r;
          try { r = JSON.parse(j); } catch(e) { r = { success: false, error: 'Unexpected server response' }; }
          onSuccess(r);

        .withFailureHandler(function(e) {
          var msg = t('network') + (e && e.message ? ' (' + e.message + ')' : '');
          if (onError) onError(msg); else showToast(msg);

      if (s === null || s === undefined) return '';

    }
    function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e) { return d; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
    function lsDel(k) { try { localStorage.removeItem(k); } catch(e) {} }
    function lsJSON(k, d) { try { return JSON.parse(lsGet(k, '')) || d; } catch(e) { return d; } }
    // Warning box, scrolled into view so it can't appear off-screen

    function fieldError(inputId, msg) {

      clearFieldErrors();
      field.classList.add('invalid');
      var err = document.createElement('div');
      err.className = 'field-err'; err.textContent = msg;
      field.appendChild(err);
      input.focus();
      field.scrollIntoView({ block: 'center', behavior: 'smooth' });
      var clear = function() { field.classList.remove('invalid'); if (err.parentNode) err.parentNode.removeChild(err); input.removeEventListener('input', clear); input.removeEventListener('change', clear); };
      input.addEventListener('input', clear); input.addEventListener('change', clear);
    }
    function clearFieldErrors() {
      var errs = document.querySelectorAll('.field-err'), bad = document.querySelectorAll('.field.invalid'), i;
      for (i = 0; i < errs.length; i++) errs[i].parentNode.removeChild(errs[i]);
      for (i = 0; i < bad.length; i++) bad[i].classList.remove('invalid');

    // ═══════════════════════════════════════════
    // DATES
    // ═══════════════════════════════════════════
    // Parse "yyyy-MM-dd" as a local calendar date (new Date("yyyy-MM-dd") would be midnight UTC,
    // which is the previous evening in Eastern time)
    function parseLocalDate(s) {
      if (s instanceof Date) return new Date(s.getFullYear(), s.getMonth(), s.getDate());
      var m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(s || ''));
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
      var d = new Date(s);
      return isNaN(d.getTime()) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }
    function daysBetween(d1, d2) {
      var a = parseLocalDate(d1), b = parseLocalDate(d2);
      if (!a || !b) return 0;
      return Math.round((b - a) / 86400000);  // round: DST days are 23 or 25 hours
    }
    function todayDate() { return parseLocalDate(new Date()); }
    var MONTHS = { en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], es: ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'] };
    var MONTHS_LONG = { en: ['January','February','March','April','May','June','July','August','September','October','November','December'],
      es: ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'] };
    var DAYS = { en: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], es: ['dom','lun','mar','mié','jue','vie','sáb'] };
    function fmtShort(d) { d = parseLocalDate(d); if (!d) return ''; return uiLang() === 'es' ? d.getDate() + ' ' + MONTHS.es[d.getMonth()] : MONTHS.en[d.getMonth()] + ' ' + d.getDate(); }
    function fmtLong(d) {
      return uiLang() === 'es' ? DAYS.es[d.getDay()] + ', ' + d.getDate() + ' de ' + MONTHS_LONG.es[d.getMonth()]
        : DAYS.en[d.getDay()] + ', ' + MONTHS_LONG.en[d.getMonth()] + ' ' + d.getDate();
    }
    function fmtTime(tm) {
      var m = /^(\d{1,2}):(\d{2})/.exec(String(tm || '')); if (!m) return '';
      var h = +m[1];
      if (uiLang() === 'es') return h + ':' + m[2];
      return (h % 12 || 12) + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM');
    }
    // Relative label: Today / Tomorrow / Yesterday / weekday (this week) / short date
    function relDate(dateStr) {
      var d = parseLocalDate(dateStr); if (!d) return '';
      var n = daysBetween(todayDate(), d);
      if (n === 0) return t('today'); if (n === 1) return t('tomorrow'); if (n === -1) return t('yesterday');
      if (n > 1 && n <= 6) return DAYS[uiLang()][d.getDay()];
      return fmtShort(d);
    }
    function stampLabel(stamp) {  // "yyyy-MM-dd HH:mm:ss"
      var parts = String(stamp || '').split(' ');
      return relDate(parts[0]) + (parts[1] ? ' · ' + fmtTime(parts[1]) : '');
    }

    function colorFor(name) { var h = 0, s = String(name || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return COLORS[h % COLORS.length]; }
    function initials(name) {
      var parts = String(name || '').replace(/[^A-Za-zÀ-ſ .]/g, '').split(/[ .]+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
      var p = parts[0] || '?';
      return p.charAt(0).toUpperCase() + (p.charAt(1) || '').toLowerCase();
    }

    function getPin() { return lsGet('ssl_pin', ''); }

    // ═══════════════════════════════════════════
    // SIGN IN
    // ═══════════════════════════════════════════
    function saveMember(member) {
      lsSet('ssl_user', member.name);
      lsSet('ssl_admin', member.admin ? '1' : '0');
      applyMemberLanguage(member);
    }
    // Applies the language settings an admin chose for this person, but only when they're new or have
    // changed since last applied, so the person can still adjust their own in between.
    function applyMemberLanguage(member) {
      var key = (member.lang || '') + '|' + (member.primary || '');
      if (key === lsGet('ssl_lang_applied', null)) return;
      if (member.lang) lsSet('ssl_lang', member.lang);
      if (member.primary) lsSet('ssl_pref_lang', member.primary);
      lsSet('ssl_lang_applied', key);
    }
    function showSignIn(msg) {
      ['ssl_pin','ssl_user','ssl_admin','ssl_lang_applied'].forEach(lsDel);
      // Forget the previous person's Activity state so the next person starts fresh
      S.activity = []; S.seen = ''; S.viewSeen = null; S.activityLoaded = false;

      $('signin').classList.add('on');
    }
    function submitPin() {
      var pin = $('pinInput').value.trim();
      if (!pin) return;
      setBusy('pinBtn', true);
      $('pinMsg').innerHTML = '';
      callApi('signIn', [], function(result) {
        setBusy('pinBtn', false);
        lsSet('ssl_pin', pin);
        saveMember(JSON.parse(result));
        $('signin').classList.remove('on');
        startApp();
      }, function(err) {
        setBusy('pinBtn', false);
        $('pinInput').value = '';
        showMsg('pinMsg', err.message);
      }, pin);
    }
    function signOut() { callApi('signOut', [], null, null); showSignIn(''); }

    // ═══════════════════════════════════════════
    // LOADING DATA
    // ═══════════════════════════════════════════
    function loadTasks(after) {
      server(function(tasks) {
        if (Array.isArray(tasks)) { S.tasks = tasks; S.loaded = true; S.loadError = ''; }
        renderLists();
        if (after) after();
      }, function(msg) { if (!S.loaded) { S.loadError = msg; renderLists(); } }).getTasksJSON();
    }
    function loadLists() {
      server(function(r) { if (Array.isArray(r)) S.team = r.sort(function(a, b) { return a.localeCompare(b); }); }, function() {}).getTeamJSON();
      server(function(r) { if (Array.isArray(r)) S.locations = r.sort(function(a, b) { return a.localeCompare(b); }); renderLists(); }, function() {}).getLocationsJSON();
    }
    function loadActivity() {
      server(function(r) {
        if (!r.success) return;
        // "Last read" only moves forward, so a reload that crosses paths with mark-as-read can't bring the dot back
        S.activity = r.items; if ((r.seen || '') > S.seen) S.seen = r.seen; S.activityLoaded = true;
        updateActivityDot();
        if (S.tab === 'activity') { renderActivity(); markSeen(); }
      }, function() {}).getActivityJSON();
    }
    function hasUnread() {
      for (var i = 0; i < S.activity.length; i++) if (S.activity[i].at > S.seen) return true;
      return false;
    }
    function updateActivityDot() { var d = $('actDot'); if (d) d.className = 'dot' + (hasUnread() ? ' on' : ''); }
    // Viewing Activity marks it read (synced across devices). The "New" group stays put until you leave.
    function markSeen() {
      if (!S.activityLoaded || !hasUnread()) return;
      server(function(r) { if (r.success) { S.seen = r.seen; updateActivityDot(); } }, function() {}).markActivitySeen();
    }

    function startApp() {
      applyTheme(); applyFontSize();
      renderAll();
      loadTasks(function() {
        var m = /[?&]task=([^&]+)/.exec(location.search);
        if (m) {
          var id = decodeURIComponent(m[1]);
          history.replaceState(null, '', location.pathname);  // so a reload doesn't reopen it
          if (taskById(id)) openTask(id);
        }
      });
      loadLists();
      loadActivity();
      // Pick up changes to this person's name, admin status, or language since they signed in
      callApi('whoAmI', [], function(result) {
        var before = lsGet('ssl_user', '') + lsGet('ssl_admin', '') + lsGet('ssl_lang', '') + lsGet('ssl_pref_lang', '');
        saveMember(JSON.parse(result));
        if (before !== lsGet('ssl_user', '') + lsGet('ssl_admin', '') + lsGet('ssl_lang', '') + lsGet('ssl_pref_lang', '')) renderAll();
      }, null);
    }

    // ═══════════════════════════════════════════
    // SHELL: tab bar + floating bar
    // ═══════════════════════════════════════════
    var TABS = [['home','home','home'], ['tasks','tasks','tasks'], ['activity','bell','activity'], ['search','search','search'], ['account','user','account']];
    function renderTabbar() {
      $('tabbar').innerHTML = TABS.map(function(tb) {
        return '<button class="tab' + (S.tab === tb[0] ? ' active' : '') + '" data-act="tab" data-arg="' + tb[0] + '">' + ICON[tb[1]] +
          '<span>' + t(tb[2]) + '</span>' + (tb[0] === 'activity' ? '<i class="dot" id="actDot"></i>' : '') + '</button>';
      }).join('');
      updateActivityDot();
    }
    function switchTab(tab) {
      if (tab === S.tab) { window.scrollTo(0, 0); return; }
      S.tab = tab; lsSet('ssl_tab', tab);
      S.viewSeen = null;
      renderAll();
      window.scrollTo(0, 0);
      if (tab === 'activity') { loadActivity(); markSeen(); }
    }
    function renderAll() {
      document.documentElement.lang = uiLang();
      ['home','tasks','activity','search','account'].forEach(function(v) { $('view-' + v).classList.toggle('active', S.tab === v); });
      renderTabbar();
      renderFloatbar();
      if (S.tab === 'home') renderHome();
      if (S.tab === 'tasks') renderTasks();
      if (S.tab === 'activity') renderActivity();
      if (S.tab === 'search') renderSearch();
      if (S.tab === 'account') renderAccount();
      if (S.taskId && $('taskSheet').classList.contains('open')) renderTaskSheet();
    }
    function renderLists() {  // data changed: refresh whichever list is showing
      if (S.tab === 'home') renderHome();
      if (S.tab === 'tasks') renderTasks();
      if (S.tab === 'activity') renderActivity();
      if (S.tab === 'search') renderSearchResults();
    }
    function filterCount() { var f = S.filters, n = 0; if (f.assignee) n++; if (f.location) n++; if (f.priority) n++; return n; }
    function renderFloatbar() {
      var fb = $('floatbar');
      fb.classList.toggle('on', S.tab === 'tasks');
      fb.innerHTML =
        '<button class="fb icon' + (filterCount() ? ' on' : '') + '" data-act="openFilters" aria-label="' + t('filters') + '">' + ICON.filter + '</button>' +
        '<button class="fb" data-act="toggleView">' + (S.view === 'location' ? t('byLocation') : t('byDate')) + ICON.updown + '</button>' +
        '<button class="fb plus" data-act="newTask" aria-label="' + t('newTask') + '">' + ICON.plus + '</button>';
    }

    // ═══════════════════════════════════════════
    // TASK ROWS + GROUPING
    // ═══════════════════════════════════════════
    var PRIORITY_RANK = { Urgent: 0, High: 1, Medium: 2, Low: 3 };
    function byDue(a, b) {
      var da = a['Due Date'] || '9999', db = b['Due Date'] || '9999';
      if (da !== db) return da < db ? -1 : 1;
      var pa = PRIORITY_RANK[a.Priority] !== undefined ? PRIORITY_RANK[a.Priority] : 4, pb = PRIORITY_RANK[b.Priority] !== undefined ? PRIORITY_RANK[b.Priority] : 4;
      if (pa !== pb) return pa - pb;
      return String(titleOf(a).primary).localeCompare(String(titleOf(b).primary));
    }
    function byCompletedDesc(a, b) {
      var x = (a['Completed Date'] || '') + (a['Completed Time'] || ''), y = (b['Completed Date'] || '') + (b['Completed Time'] || '');
      return x < y ? 1 : x > y ? -1 : 0;
    }
    function isDone(task) { return task.Status === 'Complete'; }
    function daysUntil(task) { var d = parseLocalDate(task['Due Date']); return d ? daysBetween(todayDate(), d) : null; }
    function isOverdue(task) { var n = daysUntil(task); return !isDone(task) && n !== null && n < 0; }

    function rowHtml(task) {
      var done = isDone(task), n = daysUntil(task), pill;
      if (done) pill = '<span class="date-pill">' + escHtml(fmtShort(task['Completed Date'])) + '</span>';
      else if (n === null) pill = '<span class="date-none">' + ICON.cal + '</span>';
      else pill = '<span class="date-pill' + (n < 0 ? ' overdue' : n === 0 ? ' today' : '') + '">' + escHtml(n < 0 ? fmtShort(task['Due Date']) : relDate(task['Due Date'])) + '</span>';
      var sub = [];
      if (task.Location) sub.push(escHtml(task.Location));
      if (task['Subtasks Total']) sub.push('☑ ' + (task['Subtasks Done'] || 0) + '/' + task['Subtasks Total']);
      if (task.Assignee && task.Assignee !== 'Team') sub.push(escHtml(task.Assignee));
      return '<div class="row' + (done ? ' done' : '') + '" data-act="openTask" data-arg="' + escHtml(task['Task ID']) + '">' +
        '<span class="check' + (done ? ' done' : '') + '">' + ICON.check + '</span>' +
        '<div class="row-body"><div class="row-main"><div class="row-title">' + escHtml(titleOf(task).primary) + '</div>' +
        (sub.length ? '<div class="row-sub">' + sub.join(' · ') + '</div>' : '') + '</div>' + pill + '</div></div>';
    }
    function isCollapsed(key) { return S.collapsed[key] !== undefined ? S.collapsed[key] : key === 'completed'; }
    function sectionHtml(key, label, tasks, red) {
      var collapsed = isCollapsed(key);
      return '<div class="sec' + (collapsed ? ' collapsed' : '') + (red && tasks.length ? ' red' : '') + '" id="sec-' + escHtml(key) + '" data-act="toggleSec" data-arg="' + escHtml(key) + '">' +
        '<span class="caret"></span><span class="stitle">' + escHtml(label) + '</span><span class="count">' + tasks.length + '</span></div>' +
        '<div class="rows' + (collapsed ? ' hidden' : '') + '">' + tasks.map(rowHtml).join('') + '</div>';
    }
    function matchesFilters(task) {
      var f = S.filters, me = getUserName();
      if (f.assignee === '__me' && task.Assignee !== me) return false;
      if (f.assignee && f.assignee !== '__me' && task.Assignee !== f.assignee) return false;
      if (f.location === '__none' && task.Location) return false;
      if (f.location && f.location !== '__none' && task.Location !== f.location) return false;
      if (f.priority && task.Priority !== f.priority) return false;
      return true;
    }
    function dateGroups(tasks) {
      var g = { overdue: [], today: [], week: [], later: [], nodate: [] };
      tasks.forEach(function(task) {
        if (isDone(task)) return;
        var n = daysUntil(task);
        if (n === null) g.nodate.push(task);
        else if (n < 0) g.overdue.push(task);
        else if (n === 0) g.today.push(task);
        else if (n <= 6) g.week.push(task);
        else g.later.push(task);
      });
      for (var k in g) g[k].sort(byDue);
      return g;
    }

    // ═══════════════════════════════════════════
    // TASKS TAB
    // ═══════════════════════════════════════════
    function renderTasks() {
      var el = $('view-tasks');
      var head = '<div class="vhead"><h1 class="vtitle">' + t('tasks') + '</h1><button class="iconbtn" data-act="refresh" aria-label="Refresh">' + ICON.refresh + '</button></div>';
      if (!S.loaded) { el.innerHTML = head + (S.loadError ? '<div class="pad"><div class="error-msg">' + escHtml(S.loadError) + '</div></div>' : '<div class="loading">' + t('loading') + '</div>'); return; }
      var tasks = S.tasks.filter(matchesFilters);
      var html = head;
      if (S.view === 'location') {
        var groups = {}, names = [];
        tasks.forEach(function(task) {
          if (isDone(task)) return;
          var k = task.Location || '';
          if (!groups[k]) { groups[k] = []; names.push(k); }
          groups[k].push(task);
        });
        names.sort(function(a, b) { return !a ? 1 : !b ? -1 : a.localeCompare(b); });
        names.forEach(function(k) { html += sectionHtml('loc:' + k, k || t('noLocation'), groups[k].sort(byDue)); });
        if (!names.length) html += '<div class="empty">' + t('noTasks') + '</div>';
      } else {
        var g = dateGroups(tasks);
        html += sectionHtml('overdue', t('secOverdue'), g.overdue, true) + sectionHtml('today', t('secToday'), g.today) +
          sectionHtml('week', t('secWeek'), g.week) + sectionHtml('later', t('secLater'), g.later) + sectionHtml('nodate', t('secNoDate'), g.nodate);
      }
      html += sectionHtml('completed', t('secCompleted'), tasks.filter(isDone).sort(byCompletedDesc).slice(0, 60));
      el.innerHTML = html;
    }
    function toggleSection(key) {

    var PAGE_ID = String(Date.now()) + Math.random();
    var sheetStack = [], skipPops = 0;

    function openSheet(id) {

    function closeSheets(n) {

    // ── Comments + photo uploads ───────────────
    var MAX_FILE_SIZE = 10 * 1024 * 1024;
    var ALLOWED_TYPES = ['image/jpeg','image/jpg','image/png','image/heic','image/heif','image/webp'];
    function validatePhoto(file) {
      if (ALLOWED_TYPES.indexOf((file.type || '').toLowerCase()) === -1) return 'Only image files (JPEG, PNG, HEIC, WebP).';
      if (file.size > MAX_FILE_SIZE) return 'File too large (' + (file.size / 1048576).toFixed(1) + 'MB). Max 10MB.';
      return null;
    }
    // The uploader's name is filled in by the server from the PIN
    function uploadPhotos(taskId, commentId, files, taskTitle, callback) {
      var idx = 0;
      var next = function() {
        if (idx >= files.length) { if (callback) callback(); return; }
        var file = files[idx++], reader = new FileReader();
        reader.onload = function(e) {
          server(function(r) { if (!r.success) showToast(r.error || 'Photo upload failed'); next(); }, function(m) { showToast(m); next(); })
            .savePhoto(taskId, commentId || '', e.target.result.split(',')[1], file.name, file.type || 'image/jpeg', '', taskTitle || '');
        };
        reader.onerror = function() { next(); };
        reader.readAsDataURL(file);
      };
      next();
    }
    function postComment() {
      var text = $('commentText').value.trim(), photos = Array.prototype.slice.call($('commentPhoto').files || []), id = S.taskId;
      if (!text) { fieldError('commentText', t('commentRequired')); return; }
      if (photos.length > 5) { showMsg('commentMsg', t('max5')); return; }
      for (var i = 0; i < photos.length; i++) { var ve = validatePhoto(photos[i]); if (ve) { showMsg('commentMsg', ve); return; } }
      var task = taskById(id);
      // S.posting keeps Post disabled even if the sheet re-renders mid-request (no double posts)
      var stop = function() { S.posting = false; if (S.taskId === id) setBusy('commentBtn', false); };
      S.posting = true; setBusy('commentBtn', true);
      $('commentMsg').innerHTML = '<div class="loading">' + t('saving') + '</div>';
      server(function(r) {
        if (!r.success) { stop(); showMsg('commentMsg', r.error || 'Error'); return; }
        var finish = function() {
          S.posting = false;
          if (S.taskId === id) { $('commentText').value = ''; $('commentMsg').innerHTML = ''; $('commentPhoto').value = ''; loadTaskDetails(id); }
          loadTasks();
        };
        if (photos.length) { $('commentMsg').innerHTML = '<div class="loading">' + t('uploading') + '</div>'; uploadPhotos(id, r.commentId, photos, task ? task.Title : '', finish); }
        else finish();
      }, function(m) { stop(); showMsg('commentMsg', m); }).addComment(id, '', text);
    }

    function saveForm(mode) {
      var title = $('fTitle').value.trim(), desc = $('fDesc').value.trim(), assignee = $('fAssign').value, pri = $('fPri').value, loc = $('fLoc').value,
          due = $('fDue').value, time = $('fTime').value, rec = $('fRec').value;
      clearFieldErrors(); $('formMsg').innerHTML = '';
      if (!title) { fieldError('fTitle', t('required')); return; }
      if (!assignee) { fieldError('fAssign', t('required')); return; }
      // Errors go next to the field they're about (password problems under the password box)
      var fail = function(m) { setFormBusy(false); $('formMsg').innerHTML = ''; if (mode === 'edit' && isPasswordError(m)) fieldError('fPw', m); else showMsg('formMsg', m); };
      if (mode === 'edit') {

        setFormBusy(true);
        $('formMsg').innerHTML = '<div class="loading">' + t('saving') + '</div>';
        server(function(r) {

          setFormBusy(false); closeTopSheet(); showToast(t('taskSaved'));
          loadTasks(function() { if (S.taskId === id) renderTaskSheet(); });
        }, fail).updateTask(id, title, desc, assignee, pri, loc, due, time, rec, pw);
        return;
      }
      var photos = Array.prototype.slice.call($('fPhotos').files || []);

      for (var i = 0; i < photos.length; i++) { var ve = validatePhoto(photos[i]); if (ve) { fieldError('fPhotos', ve); return; } }
      setFormBusy(true);
      $('formMsg').innerHTML = '<div class="loading">' + t('saving') + '</div>';
      server(function(r) {
        if (!r.success) { fail(r.error || 'Error'); return; }
        var finish = function() { setFormBusy(false); closeTopSheet(); showToast(t('taskCreated')); loadTasks(); loadActivity(); };
        if (photos.length) { $('formMsg').innerHTML = '<div class="loading">' + t('uploading') + '</div>'; uploadPhotos(r.taskId, null, photos, title, finish); }

    }
    var ADMIN = {
      addMember: function() {
        var n = $('newMember').value.trim(); if (!n) return;
        server(function(r) { if (!r.success) { showToast(r.error || 'Error'); return; } loadLists(); openTeam(); }).addTeamMember(n);
      },
      saveLang: function() {
        var name = $('langMember').value; setBusy('langSave', true);
        server(function(r) {
          setBusy('langSave', false);
          if (!r.success) { showMsg('langMsg', r.error || 'Error'); return; }
          okMsg('langMsg', t('saved') + '. ' + t('appliesNext'));
          var m = teamCache.filter(function(x) { return x.name === name; })[0]; if (m) { m.lang = $('langSetting').value; m.primary = $('primarySetting').value; }
        }, function(m) { setBusy('langSave', false); showMsg('langMsg', m); }).setMemberLanguage(name, $('langSetting').value, $('primarySetting').value);
      },
      setPin: function() {
        var name = $('pinMember').value, pin = $('pinNew').value.trim(), pw = $('pinPw').value;
        if (!name || !pin || !pw) { fieldError(!pin ? 'pinNew' : 'pinPw', t('allRequired')); return; }
        setBusy('setPinBtn', true);
        server(function(r) {
          setBusy('setPinBtn', false);
          if (!r.success) { if (isPasswordError(r.error)) fieldError('pinPw', r.error); else showMsg('pinAdminMsg', r.error || 'Error'); return; }
          $('pinNew').value = ''; okMsg('pinAdminMsg', t('saved') + ': ' + name);
        }, function(m) { setBusy('setPinBtn', false); showMsg('pinAdminMsg', m); }).setMemberPin(name, pin, pw);
      },
      removeMember: function() {
        var name = $('pinMember').value, pw = $('pinPw').value;
        if (!name || !pw) { fieldError('pinPw', t('allRequired')); return; }
        if (!window.confirm(t('removeQ', { name: name }))) return;
        setBusy('removeBtn', true);
        server(function(r) {
          setBusy('removeBtn', false);
          if (!r.success) { if (isPasswordError(r.error)) fieldError('pinPw', r.error); else showMsg('pinAdminMsg', r.error || 'Error'); return; }
          loadLists(); openTeam();
        }, function(m) { setBusy('removeBtn', false); showMsg('pinAdminMsg', m); }).removeTeamMember(name, pw);
      },
      addLocation: function() {
        var n = $('newLoc').value.trim(); if (!n) return;
        server(function(r) { if (!r.success) { showToast(r.error || 'Error'); return; } S.locations.push(n); S.locations.sort(); openLocations(); loadLists(); }).addLocation(n);
      },
      removeLocation: function(name) {
        if (!window.confirm(t('removeLocQ', { name: name }))) return;
        server(function(r) { if (!r.success) { showToast(r.error || 'Error'); return; } S.locations = S.locations.filter(function(x) { return x !== name; }); openLocations(); loadLists(); }).removeLocation(name);
      },
      changePw: function() {
        var o = $('pwOld').value, n = $('pwNew').value, c = $('pwConfirm').value;
        if (!o || !n) { fieldError(!o ? 'pwOld' : 'pwNew', t('allRequired')); return; }
        if (n !== c) { fieldError('pwConfirm', t('pwMismatch')); return; }
        setBusy('pwBtn', true);
        server(function(r) {
          setBusy('pwBtn', false);
          if (!r.success) { if (/incorrect|incorrecta/i.test(r.error || '')) fieldError('pwOld', r.error); else showMsg('pwMsg', r.error || 'Error'); return; }
          okMsg('pwMsg', t('pwChanged')); $('pwOld').value = $('pwNew').value = $('pwConfirm').value = '';
        }, function(m) { setBusy('pwBtn', false); showMsg('pwMsg', m); }).changeDeletePassword(o, n);
      },
      deleteOrphans: function() {
        if (!window.confirm(t('deleteOrphansQ'))) return;
        server(function(r) {
          if (!r.success) { showMsg('adminBody', r.error || 'Error'); return; }
          okMsg('adminBody', 'Deleted ' + r.deletedComments + ' comment rows and ' + r.deletedPhotos + ' photo rows.');
        }).deleteOrphansJSON();
      }
    };
    function openLocations() {
      adminSheet(t('locations'), '<div class="card" style="margin:0">' + S.locations.map(function(l) {
        return '<div class="lbtn"><span class="swatch" style="background:' + colorFor(l) + '"></span><span class="grow">' + escHtml(l) + '</span><button class="textbtn" style="color:var(--red)" data-act="admin" data-fn="removeLocation" data-arg="' + escHtml(l) + '">' + t('remove') + '</button></div>';
      }).join('') + '<div class="addline"><input class="input" id="newLoc" placeholder="' + t('addLocation') + '"><button class="btn" data-act="admin" data-fn="addLocation">' + t('add') + '</button></div></div>');
    }
    var loginLog = [];
    function openLoginLog() {
      adminSheet(t('loginLog'), '<div class="loading">' + t('loading') + '</div>');
      server(function(r) {
        if (!r.success) { showMsg('adminBody', r.error || 'Error'); return; }
        loginLog = r.entries;
        var names = []; loginLog.forEach(function(e) { if (names.indexOf(e.name) === -1) names.push(e.name); }); names.sort();
        $('adminBody').innerHTML = '<div class="field"><select id="logFilter" data-change="renderLog">' + opt('', t('everyone'), '') + names.map(function(n) { return opt(n, n, ''); }).join('') + '</select></div>' +
          '<div id="logTable"></div><p class="muted" style="font-size:.85rem">' + t('logNote') + '</p>';
        renderLog();
      }, function(m) { showMsg('adminBody', m); }).getLoginLogJSON(300);
    }
    function renderLog() {
      var who = $('logFilter').value, rows = loginLog.filter(function(e) { return !who || e.name === who; });
      $('logTable').innerHTML = '<table class="stats"><thead><tr><th>' + t('when') + '</th><th>' + t('who') + '</th><th>' + t('event') + '</th><th>' + t('device') + '</th></tr></thead><tbody>' +
        rows.map(function(e) {
          return '<tr><td>' + escHtml(fmtShort(e.date)) + '<br><span class="muted">' + escHtml(fmtTime(e.time)) + '</span></td><td>' + escHtml(e.name) + '</td><td' + (/Wrong|Locked/.test(e.event) ? ' class="red"' : '') + '>' + escHtml(e.event) + '</td><td class="muted">' + escHtml(e.device) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    function openPassword() {
      adminSheet(t('changePw'), '<div class="field"><label>' + t('currentPw') + '</label><input type="password" id="pwOld"></div><div class="field"><label>' + t('newPw') + '</label><input type="password" id="pwNew"></div>' +
        '<div class="field"><label>' + t('confirmPw') + '</label><input type="password" id="pwConfirm"></div><div id="pwMsg"></div><button class="btn block" id="pwBtn" data-act="admin" data-fn="changePw">' + t('save') + '</button>');
    }
    function openAudit() {
      adminSheet(t('audit'), '<div class="loading">' + t('loading') + '</div>');
      server(function(r) {
        if (!r.success) { showMsg('adminBody', r.error || 'Error'); return; }
        var oc = r.orphanComments, op = r.orphanPhotos;
        $('adminBody').innerHTML = '<div class="card" style="margin:0 0 1rem"><div class="lbtn"><span class="grow">' + t('orphanComments') + '</span><b>' + oc.length + '</b></div><div class="lbtn"><span class="grow">' + t('orphanPhotos') + '</span><b>' + op.length + '</b></div></div>' +
          op.map(function(p) { return '<div class="muted" style="font-size:.9rem;padding:.3rem 0">' + escHtml(p['Task Title'] || '(no title)') + ' · ' + escHtml(p['Uploaded By'] || '') + '</div>'; }).join('') +
          (oc.length || op.length ? '<button class="btn danger block" style="margin-top:1rem" data-act="admin" data-fn="deleteOrphans">' + t('deleteOrphans') + '</button>' : '<div class="ok-msg">' + t('noOrphans') + '</div>');
      }, function(m) { showMsg('adminBody', m); }).auditOrphansJSON();
    }
    function openStats() {
      var today = todayDate();
      var rows = [30, 60, 90, 180, 365].map(function(n) { return [t('lastN', { n: n }), completionStats(n)]; });
      rows.push([t('ytd'), completionStats(0, new Date(today.getFullYear(), 0, 1))]);
      var openNow = S.tasks.filter(function(x) { return !isDone(x); }).length;
      adminSheet(t('stats'), '<div class="card" style="margin:0 0 1rem"><div class="statline"><div><b>' + openNow + '</b>' + t('openNow') + '</div></div></div>' +
        '<table class="stats"><thead><tr><th>' + t('period') + '</th><th>' + t('total') + '</th><th>' + t('onTime') + '</th><th>' + t('late') + '</th><th>' + t('avgLate') + '</th></tr></thead><tbody>' +
        rows.map(function(r) { var s = r[1]; return '<tr><td>' + escHtml(r[0]) + '</td><td>' + s.total + '</td><td class="green">' + s.onTime + '</td><td class="red">' + s.late + '</td><td>' + (s.late ? (s.totalLate / s.late).toFixed(1) : '—') + '</td></tr>'; }).join('') +
        '</tbody></table><p class="muted" style="font-size:.85rem">' + t('statsNote') + '</p>');
    }

    // ═══════════════════════════════════════════
    // TOAST
    // ═══════════════════════════════════════════
    var toastTimer = null, toastUndoFn = null;
    function showToast(msg, onUndo) {
      $('toastMsg').textContent = msg;
      $('toastBtn').textContent = t('undo');
      $('toastBtn').style.display = onUndo ? '' : 'none';
      toastUndoFn = onUndo || null;
      $('toast').classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { $('toast').classList.remove('on'); toastUndoFn = null; }, onUndo ? 6000 : 3000);
    }

    // ═══════════════════════════════════════════
    // CLICK HANDLING (one listener; elements say what to do with data-act / data-arg)
    // ═══════════════════════════════════════════
    var ACT = {
      signIn: submitPin, signOut: signOut,
      tab: switchTab, refresh: function() { loadTasks(); loadActivity(); loadLists(); },
      openTask: openTask, toggleSec: toggleSection, goSection: goToSection, goLocation: goLocation,
      toggleView: function() { S.view = S.view === 'location' ? 'date' : 'location'; lsSet('ssl_view', S.view); renderFloatbar(); renderTasks(); },
      openFilters: openFilters, applyFilters: function() { applyFilters(false); }, clearFilters: function() { applyFilters(true); },
      newTask: function() { openForm('create'); },
      closeTop: closeTopSheet, openMenu: openMenu, closeMenu: closeMenu,
      menuEdit: function() { closeMenu(); openForm('edit'); }, menuDelete: function() { closeMenu(); openDelete(); },
      copyLink: copyLink, completeTask: completeTask, reopenTask: function() { reopenTask(); },
      toggleSub: toggleSub, addSub: addSub, editSub: editSub, deleteSub: deleteSub,
      postComment: postComment, openPhoto: openPhoto,
      closeLightbox: function(arg, el, e) { if (e.target.tagName !== 'IMG') $('lightbox').classList.remove('on'); },
      saveForm: saveForm, confirmDelete: confirmDelete,
      toastUndo: function() { var f = toastUndoFn; toastUndoFn = null; $('toast').classList.remove('on'); if (f) f(); },
      setLang: setLang, setPref: setPrefLang,
      setTheme: function(v) { lsSet('ssl_theme', v); applyTheme(); renderAccount(); },
      setSize: function(v) { lsSet('ssl_fs', v); applyFontSize(); renderAccount(); },
      openTeam: openTeam, openLocations: openLocations, openLoginLog: openLoginLog, openPassword: openPassword, openAudit: openAudit, openStats: openStats,
      admin: function(arg, el) { ADMIN[el.getAttribute('data-fn')](arg); },
      pickAssignee: function() {
        var me = getUserName();
        var opts = [{ value: '__me', label: t('me') + ' (' + me + ')', avatar: me }, { value: 'Team', label: t('team'), avatar: 'Team' }]
          .concat(S.team.filter(function(n) { return n !== me; }).map(function(n) { return { value: n, label: n, avatar: n }; }));
        openPicker(t('tasksAssignedTo'), opts, function(o) { setSearchMode('assignee', o.value, o.label); });
      },
      pickLocation: function() {
        var opts = S.locations.map(function(n) { return { value: n, label: n, color: colorFor(n) }; }).concat([{ value: '__none', label: t('noLocation') }]);
        openPicker(t('tasksAt'), opts, function(o) { setSearchMode('location', o.value, o.label); });
      },
      pick: function(i) { var o = PICK.options[+i], cb = PICK.cb; closeTopSheet(); if (cb && o) cb(o); },
      searchCreated: function() { setSearchMode('created', '', t('iCreated')); },
      searchAssignedOthers: function() { setSearchMode('assignedOthers', '', t('iAssigned')); },
      searchCompleted: function() { setSearchMode('completed', '', t('recentlyCompleted')); },
      clearSearch: function() { S.search = { mode: '', arg: '', label: '' }; renderSearchResults(); }
    };
    document.addEventListener('click', function(e) {
      if (e.target.closest('a[href]')) return;  // map links etc. open normally
      var el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      var fn = ACT[el.getAttribute('data-act')];
      if (fn) { e.preventDefault(); fn(el.getAttribute('data-arg'), el, e); }
    });
    document.addEventListener('change', function(e) {
      var fn = e.target.getAttribute && e.target.getAttribute('data-change');
      if (fn === 'fillLang') fillLang();
      if (fn === 'renderLog') renderLog();
    });
    $('searchInput').addEventListener('input', renderSearchResults);
    $('pinInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') submitPin(); });
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      if ($('lightbox').classList.contains('on')) { $('lightbox').classList.remove('on'); return; }
      if ($('menu').classList.contains('open')) { closeMenu(); return; }
      closeTopSheet();
    });

    // ═══════════════════════════════════════════
    // START
    // ═══════════════════════════════════════════
    applyTheme(); applyFontSize();
    if (getPin()) startApp(); else { renderAll(); showSignIn(''); }
    // Quiet refresh every 2 minutes (an open task isn't re-rendered, so nothing you're typing is lost)
    setInterval(function() { if (getPin() && !document.hidden) { loadTasks(); loadActivity(); } }, 120000);
  </script>
</body>
</html>
